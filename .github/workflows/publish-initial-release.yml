name: Publish Initial Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish 0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package
        run: |
          bun run build
          bun run typecheck
          bun test

      - name: Check if version already exists on npm
        id: npm
        continue-on-error: true
        run: npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version

      - name: Fail if version already exists
        if: steps.npm.outcome == 'success'
        run: |
          echo "Version ${{ steps.package.outputs.version }} is already published to npm."
          exit 1

      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from changelog
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { capture=1; next }
            capture && $0 ~ "^## " { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release notes for $VERSION were not found in CHANGELOG.md"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
